name: Cherry-Pick PR

on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cherry-pick:
    name: Cherry-Pick PR
    if: >-
      (github.event.issue.pull_request && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && (startsWith(github.event.comment.body, 'cherry-pick to') || startsWith(github.event.comment.body, 'cherry pick to'))) ||
      github.event.pull_request.merged
    concurrency:
      group: cherry-pick-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ${{ vars.WHBUILD_RUNNER && fromJSON(vars.WHBUILD_RUNNER) || 'ubuntu-26.04' }}
    steps:
      - name: Generate bot token
        id: get-token
        uses: actions/create-github-app-token@v3
        with:
          private-key: ${{ secrets.WEBHARE_BOT_PRIVATEKEY }}
          app-id: ${{ secrets.WEBHARE_BOT_APPID }}

      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.get-token.outputs.token }}

      - name: Cherry-pick requested branches
        uses: maxlapides/cherry-picker@96e6113000ba1c01e0d34effb5b94a58b4b3f85a
        with:
          token: ${{ steps.get-token.outputs.token }}
          gh_token: ${{ secrets.GH_TOKEN }}
          pr_number: ${{ github.event.issue.number || github.event.number }}
          auto_approve_and_merge: false
