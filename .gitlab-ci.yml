# Pipelines: https://gitlab.com/webhare/proxy/pipelines

image: docker:latest

services:
  - docker:dind

stages:
- build
# - test
- push

buildimage:
  artifacts:
    paths:
      - docker-images
  stage: build
  script:
    - mkdir docker-images
    - docker build --pull --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker save $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG > docker-images/app.tar

#testimage:
#  stage: test
#  script:
#    - docker load -i docker-images/app.tar
#    - docker run --rm -e CI_PROJECT_URL="$CI_PROJECT_URL" -e CI_COMMIT_SHA="$CI_COMMIT_SHA" $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG /root/test.sh

pushimage:
  stage: push
  only:
    - master
  except:
    - schedules
  script:
    - docker load -i docker-images/app.tar
    - echo $DOCKERHUB_REGISTRY_PASSWORD | docker login -u $DOCKERHUB_REGISTRY_USER --password-stdin
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

