# https://gitlab.b-lex.com/webhare/nginx-proxy/pipelines

stages:
  - build
  - deploy

# the TAG variable is also used by the docker.sh script
variables:
  TAG: $CI_REGISTRY_IMAGE:$CI_BUILD_REF_NAME

before_script:
  - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  - set | grep ^CI

after_script:
  - docker logout $CI_REGISTRY

buildmachine:
  stage: build
  script:
    - ./docker.sh build
    - docker push $TAG

taggedpush:
  stage: deploy
  only:
    - tags
  script:
    - docker tag $TAG $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
