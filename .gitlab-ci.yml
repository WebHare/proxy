# Pipelines: https://gitlab.webhare.com/webhare-opensource/proxy/pipelines
# About CI variables: https://docs.gitlab.com/ee/ci/variables/predefined_variables.html
# Registry contents: https://gitlab.webhare.com/webhare-opensource/proxy/container_registry

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_BUILDKIT: 1  # needed for cache mounts
  DOCKER_CONFIG: /tmp/docker-creds-$CI_CONCURRENT_ID/

image: docker:latest

services:
- docker:dind

stages:
- build
- test
- push
- push_dockerhub

default:
  interruptible: true
  before_script:
    - ( which apk && apk add git ) || true    # executes on alpine only

buildimage:
  artifacts:
    paths:
      - docker-images
    expire_in: 1 week
  stage: build
  script:
    - mkdir docker-images
    - ./proxy.sh build
    - docker save webhare/proxy:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG} > docker-images/app.tar

testimage:
  stage: test
  script:
    - docker load -i docker-images/app.tar
    - TEST_PROXY_IMAGE=webhare/proxy:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG} ./test.sh

pushimage_our_registry:
  stage: push
  except:
    - schedules
  script:
    - docker load -i docker-images/app.tar
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin ${CI_REGISTRY}
    - docker tag webhare/proxy:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG} ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}

pushimage_docker_hub:
  stage: push_dockerhub
  only:
    - master
    - tags
  except:
    - schedules
  script:
    - docker load -i docker-images/app.tar
    - echo $DOCKERHUB_REGISTRY_PASSWORD | docker login -u $DOCKERHUB_REGISTRY_USER --password-stdin
    - docker push webhare/proxy:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}
