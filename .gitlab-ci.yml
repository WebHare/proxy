# Pipelines: https://gitlab.webhare.com/webhare-opensource/proxy/pipelines
# About CI variables: https://docs.gitlab.com/ee/ci/variables/predefined_variables.html
# Registry contents: https://gitlab.webhare.com/webhare-opensource/proxy/container_registry

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  STORAGE_DRIVER: vfs
  BUILDAH_FORMAT: docker

image: quay.io/podman/stable:latest

stages:
- build
- test
- push
- push_dockerhub

default:
  interruptible: true
  before_script:
    - ( which apk && apk add git ) || true    # executes on alpine only

buildimage:
  artifacts:
    paths:
      - container-images
    expire_in: 1 week
  stage: build
  script:
    - mkdir container-images
    - ./proxy.sh build
    - podman save webhare/proxy:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG} > container-images/app.tar

testimage:
  stage: test
  script:
    - podman load -i container-images/app.tar
    - TEST_PROXY_IMAGE=webhare/proxy:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG} ./test.sh

pushimage_our_registry:
  stage: push
  except:
    - schedules
  script:
    - podman load -i container-images/app.tar
    - echo $CI_REGISTRY_PASSWORD | podman login -u $CI_REGISTRY_USER --password-stdin ${CI_REGISTRY}
    - podman tag webhare/proxy:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG} ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}
    - podman push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}
    - echo "To install, SV install -s ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG} <server>"

pushimage_docker_hub:
  stage: push_dockerhub
  only:
    - master
    - tags
  except:
    - schedules
  script:
    - podman load -i container-images/app.tar
    - echo $DOCKERHUB_REGISTRY_PASSWORD | podman login -u $DOCKERHUB_REGISTRY_USER --password-stdin docker.io
    - podman push webhare/proxy:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}
