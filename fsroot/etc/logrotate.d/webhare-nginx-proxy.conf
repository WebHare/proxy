/opt/webhare-proxy-data/log/*.log {
  daily
  dateext
  missingok
  rotate 90
  compress
  delaycompress
  sharedscripts
  prerotate
    if [ -d /etc/logrotate.d/httpd-prerotate ]; then \
      run-parts /etc/logrotate.d/httpd-prerotate; \
    fi \
  endscript
  postrotate
    [ -f /opt/webhare-proxy-data/var/nginx.pid ] && kill -USR1 `cat /opt/webhare-proxy-data/var/nginx.pid`
  endscript
}
