/opt/webhare-proxy-data/log/*.log {
        daily
        missingok
        dateext
        rotate 32
        compress
        delaycompress
        notifempty
        create 644 root root
        sharedscripts
        postrotate
                [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid`
        endscript
}
